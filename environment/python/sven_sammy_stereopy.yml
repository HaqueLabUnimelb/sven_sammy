# Environment for 3_STOmics_liver_v1.3/2_bin20_matrix/01_Y01453J8_bin20_gef_to_h5ad.py
#
# The script ran on 16 July 2026 with the conda environment stereopy_latest_py38
# (Python 3.8, created on 7 July 2026, removed on 18 November 2026). Python found its
# packages in two places: the environment itself (its package list of 18 November 2026
# names stereopy 1.6.2 and gefpy 1.3.2) and the user site ~/.local/lib/python3.8 of the
# account that ran it (52 packages installed on 7 July 2026, among them panel, holoviews,
# datashader, scanpy 1.9.6 and pillow).
#
# This file lists stereopy 1.6.2, the packages that the script uses directly, and every
# other package that `pip install stereopy==1.6.2 ipython` installs (stereopy imports
# IPython but does not declare it), each pinned to the version that the original
# environment or user site held. Documentation tools and the Jupyter kernel packages of
# the original environment are left out: the script does not use them.
#
# Create:  conda env create -f sven_sammy_stereopy.yml
name: sven_sammy_stereopy
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.8.20
  # conda-forge has no pip 25.0.1 build for Python 3.8; pip below upgrades itself to the
  # version of the original environment
  - pip=24.3.1
  - setuptools=69.5.1
  - wheel=0.45.1
